name               = "g3-attendance-worker"
main               = "src/index.ts"
compatibility_date = "2024-09-01"

[assets]
directory = "./public"
binding   = "ASSETS"

[triggers]
# Close forgotten sessions promptly after the 12-hour limit.
crons = ["* * * * *"]

[[routes]]
pattern   = "g3signin.johnrachwalski.com/*"
zone_name = "johnrachwalski.com"

[[routes]]
pattern   = "g3signout.johnrachwalski.com/*"
zone_name = "johnrachwalski.com"
